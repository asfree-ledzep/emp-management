name: Deploy to AWS Beanstalk

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 다운로드
        uses: actions/checkout@v3

      - name: JDK 17 설치
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Maven 빌드
        run: ./mvnw clean package -DskipTests

      - name: ZIP 생성
        run: |
          zip -r deploy.zip target/*.jar Procfile .ebextensions/

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: S3 업로드
        run: |
          aws s3 cp deploy.zip s3://elasticbeanstalk-ap-northeast-2-413790913389/deploy.zip

      - name: Beanstalk 배포
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name emp-management \
            --version-label v-${{ github.run_number }} \
            --source-bundle S3Bucket=elasticbeanstalk-ap-northeast-2-413790913389,S3Key=deploy.zip \
            --region ap-northeast-2

          aws elasticbeanstalk update-environment \
            --application-name emp-management \
            --environment-name emp-management-env \
            --version-label v-${{ github.run_number }} \
            --region ap-northeast-2
